<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In · No-Website Business Finder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117; color: #e2e8f0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: #1a1d2e; border: 1px solid #2d3148; border-radius: 14px;
      padding: 36px 32px; width: 100%; max-width: 400px;
    }
    .brand { text-align: center; margin-bottom: 24px; }
    .brand h1 { font-size: 1.3rem; color: #fff; }
    .brand .badge {
      display: inline-block; background: #f97316; color: #fff; font-size: 0.65rem; font-weight: 700;
      padding: 3px 8px; border-radius: 999px; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 8px;
    }
    label { display: block; font-size: 0.75rem; font-weight: 600; color: #94a3b8;
      text-transform: uppercase; letter-spacing: 0.06em; margin: 16px 0 6px; }
    input {
      width: 100%; background: #1e2235; border: 1px solid #2d3148; border-radius: 8px;
      color: #e2e8f0; padding: 11px 12px; font-size: 0.9rem; outline: none; transition: border-color 0.15s;
    }
    input:focus { border-color: #6366f1; }
    button {
      width: 100%; background: #6366f1; color: #fff; border: none; border-radius: 8px;
      padding: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 22px; transition: background 0.15s;
    }
    button:hover { background: #5254cc; }
    button:disabled { background: #2d3148; color: #64748b; cursor: not-allowed; }
    .alt { text-align: center; margin-top: 18px; font-size: 0.85rem; color: #94a3b8; }
    .alt a { color: #818cf8; text-decoration: none; }
    .alt a:hover { text-decoration: underline; }
    .error {
      background: #7f1d1d; border: 1px solid #991b1b; border-radius: 8px;
      padding: 10px 14px; font-size: 0.85rem; color: #fca5a5; margin-top: 16px; display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>🚫 No-Website Business Finder</h1>
      <span class="badge">Lead Gen</span>
    </div>
    <form id="form">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <div class="error" id="error"></div>
      <button type="submit" id="submit">Log In</button>
    </form>
    <div class="alt">No account? <a href="/signup">Create one</a></div>
  </div>
  <script>
    const form = document.getElementById('form');
    const errBox = document.getElementById('error');
    const btn = document.getElementById('submit');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      btn.disabled = true; btn.textContent = 'Logging in…';
      try {
        const res = await fetch('/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        window.location.href = '/';
      } catch (err) {
        errBox.textContent = err.message; errBox.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
